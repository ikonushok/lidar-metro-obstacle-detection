          - {id: body, shape: ellipsoid, center_xyz: [0.0, -16.0, 0.23], radii_xyz: [0.30, 0.55, 0.18]}
          - {id: head, shape: ellipsoid, center_xyz: [0.0, -15.48, 0.27], radii_xyz: [0.22, 0.21, 0.19]}
          - {id: forelegs, shape: cylinder, center_xyz: [0.0, -15.18, 0.12], axis_xyz: [1.0, 0.0, 0.0], radius_m: 0.055, length_m: 0.55}

  - id: suitcase
    label: Suitcase with handle
    objects:
      - id: suitcase
        category: LUGGAGE
        pose: UPRIGHT
        parts:
          - {id: body, shape: box, center_xyz: [0.35, -20.0, 0.42], size_xyz: [0.65, 0.32, 0.78], yaw_deg: 8.0}
          - {id: handle, shape: cylinder, center_xyz: [0.35, -20.0, 0.91], axis_xyz: [0.0, 0.0, 1.0], radius_m: 0.035, length_m: 0.24}

  - id: low_box
    label: Low cardboard-box proxy
    objects:
      - id: box
        category: BOX
        pose: ON_TRACK
        shape: box
        center_xyz: [0.55, -8.0, 0.15]
