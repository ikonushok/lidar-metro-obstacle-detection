# Development-only synthetic geometry in the observed lidar_livox source frame.
# Values use the project's ASSUMED_HACKATHON metre/axis hypothesis. They are not
# calibration evidence and must not be used for a CLEAR or safety decision.
schema_version: 1
status: SYNTHETIC_DEVELOPMENT_ONLY
source_frame: lidar_livox
target_from_source: lidar_livox <- lidar_livox
units: m
sensor_origin_xyz: [0.0, 0.0, 0.0]
minimum_range_m: 0.20
occlusion_epsilon_m: 0.000001
random_seed: 20260922
dropout_probability: 0.0
safety_decision_permitted: false
clear_decision_permitted: false

# Geometry-only default. A constant value makes synthetic returns easy to audit,
# but it is not a calibrated Livox/Hesai reflectivity model.
intensity:
  mode: constant
  value: 30.0

scenario_selection:
  # With no --scenario-id the stream changes scenario every 20 source frames.
  # The selected scenario id is always written to ground truth.
  mode: cycle
  frames_per_scenario: 20
  default_scenario_id: standing_person

# Dimensions and placements are synthetic development assumptions, not measured
# object models or acceptance thresholds. Each scenario contains one semantic
# object; multi-part geometry receives one object-level ground-truth id.
scenarios:
  - id: standing_person
    label: Standing person proxy
    objects:
      - id: person
        category: PERSON
        pose: STANDING
        parts:
          - {id: head, shape: ellipsoid, center_xyz: [0.0, -12.0, 1.70], radii_xyz: [0.15, 0.16, 0.17]}
          - {id: torso, shape: ellipsoid, center_xyz: [0.0, -12.0, 1.15], radii_xyz: [0.28, 0.20, 0.46]}
          - {id: left_leg, shape: cylinder, center_xyz: [-0.12, -12.0, 0.45], axis_xyz: [0.0, 0.0, 1.0], radius_m: 0.09, length_m: 0.90}
          - {id: right_leg, shape: cylinder, center_xyz: [0.12, -12.0, 0.45], axis_xyz: [0.0, 0.0, 1.0], radius_m: 0.09, length_m: 0.90}

  - id: lying_person
    label: Person lying across the track
    objects:
      - id: person
        category: PERSON
        pose: LYING
        parts:
          - {id: head, shape: ellipsoid, center_xyz: [-0.72, -18.0, 0.30], radii_xyz: [0.17, 0.16, 0.16]}
          - {id: torso, shape: ellipsoid, center_xyz: [0.0, -18.0, 0.30], radii_xyz: [0.55, 0.28, 0.23]}
          - {id: left_leg, shape: cylinder, center_xyz: [0.82, -17.87, 0.20], axis_xyz: [1.0, 0.0, 0.0], radius_m: 0.09, length_m: 0.90}
          - {id: right_leg, shape: cylinder, center_xyz: [0.82, -18.13, 0.20], axis_xyz: [1.0, 0.0, 0.0], radius_m: 0.09, length_m: 0.90}

  - id: dog_standing
    label: Medium dog standing
    objects:
      - id: dog
        category: ANIMAL_DOG
        pose: STANDING
        parts:
          - {id: body, shape: ellipsoid, center_xyz: [0.0, -10.0, 0.55], radii_xyz: [0.23, 0.50, 0.25]}
          - {id: head, shape: ellipsoid, center_xyz: [0.0, -9.48, 0.72], radii_xyz: [0.22, 0.20, 0.22]}
          - {id: front_left_leg, shape: cylinder, center_xyz: [-0.14, -9.70, 0.25], axis_xyz: [0.0, 0.0, 1.0], radius_m: 0.055, length_m: 0.45}
          - {id: front_right_leg, shape: cylinder, center_xyz: [0.14, -9.70, 0.25], axis_xyz: [0.0, 0.0, 1.0], radius_m: 0.055, length_m: 0.45}
          - {id: rear_left_leg, shape: cylinder, center_xyz: [-0.14, -10.30, 0.25], axis_xyz: [0.0, 0.0, 1.0], radius_m: 0.055, length_m: 0.45}
          - {id: rear_right_leg, shape: cylinder, center_xyz: [0.14, -10.30, 0.25], axis_xyz: [0.0, 0.0, 1.0], radius_m: 0.055, length_m: 0.45}
          - {id: tail, shape: cylinder, center_xyz: [0.0, -10.58, 0.66], axis_xyz: [0.0, -0.94, 0.34], radius_m: 0.045, length_m: 0.45}

  - id: dog_lying
    label: Medium dog lying on the track
    objects:
      - id: dog
        category: ANIMAL_DOG
