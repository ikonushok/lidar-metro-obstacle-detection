          - {id: handle_right, shape: cylinder, center_xyz: [0.40, -30.34, 0.90], axis_xyz: [0.0, -0.28, 0.96], radius_m: 0.025, length_m: 1.10}
          - {id: wheel_front_left, shape: cylinder, center_xyz: [-0.52, -29.75, 0.14], axis_xyz: [1.0, 0.0, 0.0], radius_m: 0.12, length_m: 0.10}
          - {id: wheel_front_right, shape: cylinder, center_xyz: [0.52, -29.75, 0.14], axis_xyz: [1.0, 0.0, 0.0], radius_m: 0.12, length_m: 0.10}
          - {id: wheel_rear_left, shape: cylinder, center_xyz: [-0.52, -30.25, 0.14], axis_xyz: [1.0, 0.0, 0.0], radius_m: 0.12, length_m: 0.10}
