          - {id: left_fold, shape: ellipsoid, center_xyz: [-0.46, -11.10, 0.09], radii_xyz: [0.28, 0.15, 0.08], yaw_deg: -22.0}
          - {id: right_fold, shape: ellipsoid, center_xyz: [0.20, -10.88, 0.10], radii_xyz: [0.30, 0.16, 0.09], yaw_deg: 35.0}

  - id: pipe_across_track
