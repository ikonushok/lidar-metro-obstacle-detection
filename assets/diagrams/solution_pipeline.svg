<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1320" role="img" aria-labelledby="title desc"><title id="title">Pipeline принятия решения baseline_v3</title><desc id="desc">Обработка сверху вниз, boundary-фильтр, три параллельные ветки обнаружения и общий результат.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="1240" height="1320" fill="#fff"/><style>text{font-family:Arial,'Segoe UI',sans-serif;fill:#172033;font-size:20px} .edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)} .label{font-size:18px;fill:#475569}</style><path class="edge" d="M620 90 V120"/><path class="edge" d="M620 190 V220"/><path class="edge" d="M620 290 V320"/><path class="edge" d="M620 390 V420"/><path class="edge" d="M620 505 V545"/><path class="edge" d="M825 610 H895"/><text class="label" x="860" y="593" text-anchor="middle">Да</text><path class="edge" d="M620 675 V720"/><text class="label" x="646" y="702" text-anchor="middle">Нет</text><path class="edge" d="M620 785 V808 H220 V835"/><path class="edge" d="M620 785 V835"/><path class="edge" d="M620 785 V808 H1020 V835"/><path class="edge" d="M220 955 V994 H520 V1034.15"/><path class="edge" d="M620 955 V1000"/><path class="edge" d="M1020 955 V994 H720 V1034.15"/><path class="edge" d="M415 1070 H290 V1175"/><text class="label" x="340" y="1052" text-anchor="middle">Да</text><path class="edge" d="M825 1070 H950 V1175"/><text class="label" x="897" y="1052" text-anchor="middle">Нет</text><rect x="410" y="20" width="420" height="70" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="620" y="62" text-anchor="middle">Облако точек</text><rect x="410" y="120" width="420" height="70" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="620" y="162" text-anchor="middle">Проверка входа</text><rect x="330" y="220" width="580" height="70" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="620" y="262" text-anchor="middle">Найти рельсы → построить ось пути</text><rect x="330" y="320" width="580" height="70" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="620" y="362" text-anchor="middle">Продолжить ось → построить габарит</text><rect x="330" y="420" width="580" height="85" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="620" y="456" text-anchor="middle">Выделить CORE-точки</text><text x="620" y="483" text-anchor="middle">и объединить их в компоненты</text><path d="M620 545 L825 610 L620 675 L415 610 Z" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="620" y="603.5" text-anchor="middle">Компонент похож</text><text x="620" y="630.5" text-anchor="middle">на границу тоннеля?</text><rect x="895" y="557" width="315" height="106" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="1052.5" y="590" text-anchor="middle">Boundary warning</text><text x="1052.5" y="617" text-anchor="middle">Компонент исключается</text><text x="1052.5" y="644" text-anchor="middle">из кандидатов</text><rect x="410" y="720" width="420" height="65" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="620" y="759.5" text-anchor="middle">Проверить три ветки</text><rect x="40" y="835" width="360" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="220" y="875" text-anchor="middle">Сильная геометрия</text><text x="220" y="902" text-anchor="middle">≥ 1000 точек</text><text x="220" y="929" text-anchor="middle">Кандидат сразу</text><rect x="440" y="835" width="360" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="620" y="875" text-anchor="middle">Помощь модели</text><text x="620" y="902" text-anchor="middle">&lt; 1000 точек → score ансамбля</text><text x="620" y="929" text-anchor="middle">Подтверждение: 2 кадра</text><rect x="840" y="835" width="360" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="1020" y="875" text-anchor="middle">Ранняя геометрия</text><text x="1020" y="902" text-anchor="middle">Эвристики panel / cube</text><text x="1020" y="929" text-anchor="middle">Подтверждение: 3 кадра</text><path d="M620 1000 L825 1070 L620 1140 L415 1070 Z" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="620" y="1063.5" text-anchor="middle">Хотя бы одна ветка</text><text x="620" y="1090.5" text-anchor="middle">дала кандидата?</text><rect x="55" y="1175" width="470" height="120" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="290" y="1215" text-anchor="middle">Кандидат препятствия</text><text x="290" y="1242" text-anchor="middle">+ ближайшее расстояние</text><text x="290" y="1269" text-anchor="middle">+ причины решения</text><rect x="715" y="1175" width="470" height="120" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="950" y="1215" text-anchor="middle">Нет подтверждённого кандидата</text><text x="950" y="1242" text-anchor="middle">Неподтверждённый CORE → UNKNOWN</text><text x="950" y="1269" text-anchor="middle">Это не CLEAR</text></svg>